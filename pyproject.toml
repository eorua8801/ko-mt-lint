[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ko-mt-lint"
version = "0.1.0"
description = "A linter for Korean machine-translation and LLM output — grammar, speech level, markup and placeholder checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
    "korean", "korean-nlp", "hangul", "josa", "honorifics",
    "localization", "l10n", "i18n", "translation", "machine-translation",
    "linter", "quality-assurance", "llm", "game-localization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=7", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
kolint = "kolint.cli:main"

[project.urls]
Homepage = "https://github.com/eorua8801/ko-mt-lint"
Issues = "https://github.com/eorua8801/ko-mt-lint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
